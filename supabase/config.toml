# Supabase CLI configuration — https://supabase.com/docs/guides/cli/config
# Used by `supabase start` (local Docker stack) and `supabase db push`.
project_id = "tradeconnect"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Pilot/demo setting: let people sign in immediately after registering.
# Turn this back on before a public launch.
enable_confirmations = false

[realtime]
enabled = true
